apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-api
  template:
    metadata:
      labels:
        app: churn-api
    spec:
      containers:
        - name: churn-api
          # Jamais :latest : un tag mutable rend le deploiement irreproductible.
          # Un Pod replanifie tirerait l'image que :latest designe a cet instant,
          # et rollout undo n'aurait rien a annuler (le podSpec n'a pas change).
          # Mise a jour : kubectl set image deployment/churn-api \
          #                 churn-api=ghcr.io/btecsec/mlops-mode-demploi:<nouveau-sha>
          image: ghcr.io/btecsec/mlops-mode-demploi:defe7bee86179143098a7681e1169d49fd248ae9
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: churn-api-config
            - secretRef:
                name: churn-api-secret
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
