[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-predictor"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

# Les tests corrigés du chapitre vivent à côté de solution/, pas dedans :
# un simple `pytest` lancé d'ici va les chercher au bon endroit.
[tool.pytest.ini_options]
testpaths = ["../tests"]
