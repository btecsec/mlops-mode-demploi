[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-predictor"
version = "0.1.0"
requires-python = ">=3.12"

# monitoring/ n'est pas dans src/ : sans cette déclaration, `pip install -e .`
# ne l'installe pas, et le DAG du Chapitre 11 s'arrête sur
# "ModuleNotFoundError: No module named 'monitoring'". Même leçon qu'au
# Chapitre 4 : un dossier n'est pas un paquet.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["churn_predictor*", "monitoring*"]

# Les tests corrigés du chapitre vivent à côté de solution/, pas dedans :
# un simple `pytest` lancé d'ici va les chercher au bon endroit.
[tool.pytest.ini_options]
testpaths = ["../tests"]
